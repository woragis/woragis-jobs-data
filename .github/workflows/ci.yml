name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: woragis
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ml_service_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      ML_DATABASE_URL: postgresql://woragis:password@localhost:5432/ml_service_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run database migrations
        run: |
          alembic upgrade head
      
      - name: Run unit tests
        id: unit_tests
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-report=json 2>&1 | tee test-output.log
      
      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          # Initialize defaults
          PASSED="0"
          FAILED="0"
          WARNINGS="0"
          COVERAGE="0%"
          
          # Extract test summary from output
          if [ -f test-output.log ]; then
            PASSED=$(grep -oP '\d+(?= passed)' test-output.log | head -1 || echo "0")
            FAILED=$(grep -oP '\d+(?= failed)' test-output.log | head -1 || echo "0")
            WARNINGS=$(grep -oP '\d+(?= warnings)' test-output.log | head -1 || echo "0")
            COVERAGE=$(grep -oP 'TOTAL.*\d+%' test-output.log | grep -oP '\d+\.\d+%' | head -1 || echo "0%")
          fi
          
          # Ensure values are set (handle empty strings)
          PASSED=${PASSED:-"0"}
          FAILED=${FAILED:-"0"}
          WARNINGS=${WARNINGS:-"0"}
          COVERAGE=${COVERAGE:-"0%"}
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
      
      - name: Generate test report
        if: always()
        run: |
          # Set defaults if outputs are empty
          PASSED="${{ steps.parse_results.outputs.passed }}"
          FAILED="${{ steps.parse_results.outputs.failed }}"
          WARNINGS="${{ steps.parse_results.outputs.warnings }}"
          COVERAGE="${{ steps.parse_results.outputs.coverage }}"
          
          PASSED=${PASSED:-"0"}
          FAILED=${FAILED:-"0"}
          WARNINGS=${WARNINGS:-"0"}
          COVERAGE=${COVERAGE:-"0%"}
          
          echo "## ✅ Unit Tests Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Coverage | $COVERAGE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED" != "0" ]; then
            echo "### ⚠️ Test Failures Detected" >> $GITHUB_STEP_SUMMARY
            echo "Check the test output above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add coverage details if available
          if [ -f coverage.json ]; then
            echo "### Coverage Details" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report is available in the artifacts section." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: test-output.log
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-reports
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          name: unit-tests
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: woragis
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ml_service_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    env:
      ML_DATABASE_URL: postgresql://woragis:password@localhost:5432/ml_service_test
      REDIS_URL: redis://localhost:6379/1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run database migrations
        run: |
          alembic upgrade head
      
      - name: Run integration tests
        id: integration_tests
        run: |
          pytest tests/integration/ -v -m integration --cov=app --cov-report=term --cov-report=json 2>&1 | tee test-output.log || true
        continue-on-error: true
      
      - name: Parse integration test results
        id: parse_integration_results
        if: always()
        run: |
          # Initialize defaults
          PASSED="0"
          FAILED="0"
          SKIPPED="0"
          
          # Extract test summary from output
          if [ -f test-output.log ]; then
            PASSED=$(grep -oP '\d+(?= passed)' test-output.log | head -1 || echo "0")
            FAILED=$(grep -oP '\d+(?= failed)' test-output.log | head -1 || echo "0")
            SKIPPED=$(grep -oP '\d+(?= skipped)' test-output.log | head -1 || echo "0")
          fi
          
          # Ensure values are set (handle empty strings)
          PASSED=${PASSED:-"0"}
          FAILED=${FAILED:-"0"}
          SKIPPED=${SKIPPED:-"0"}
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
      
      - name: Generate integration test report
        if: always()
        run: |
          # Set defaults if outputs are empty
          PASSED="${{ steps.parse_integration_results.outputs.passed }}"
          FAILED="${{ steps.parse_integration_results.outputs.failed }}"
          SKIPPED="${{ steps.parse_integration_results.outputs.skipped }}"
          
          PASSED=${PASSED:-"0"}
          FAILED=${FAILED:-"0"}
          SKIPPED=${SKIPPED:-"0"}
          
          echo "## 🔗 Integration Tests Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED" != "0" ]; then
            echo "### ⚠️ Integration Test Failures" >> $GITHUB_STEP_SUMMARY
            echo "Some integration tests failed. This may be expected if external services are not configured." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: test-output.log
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ml-recommendation-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm ml-recommendation-service:test python -c "import app; print('Image works!')"
      
      - name: Generate Docker build report
        if: always()
        run: |
          echo "## 🐳 Docker Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Docker image built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Image tag: \`ml-recommendation-service:test\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The image has been validated and is ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Docker build failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the build logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run Bandit (SAST)
        id: bandit
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f txt || true
        continue-on-error: true
      
      - name: Run Safety (Dependency Vulnerability Scan)
        id: safety
        run: |
          safety check --json --output safety-report.json || true
          safety check || true
        continue-on-error: true
      
      - name: Run pip-audit (Dependency Audit)
        id: pip_audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit || true
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Generate security report
        if: always()
        run: |
          echo "## 🔒 Security Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Scans" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (SAST) | ${{ steps.bandit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety (Dependencies) | ${{ steps.safety.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Dependencies) | ${{ steps.pip_audit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security reports are available in the artifacts section." >> $GITHUB_STEP_SUMMARY

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, docker-build, security-tests]
    if: always()
    
    steps:
      - name: Generate overall summary
        run: |
          echo "## 📊 CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determine overall status
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "### ✅ Overall Status: Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All critical checks passed. The service is ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Overall Status: Failure" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the job logs above." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- Unit test logs and coverage reports" >> $GITHUB_STEP_SUMMARY
          echo "- Integration test logs" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan reports" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage HTML reports (in artifacts)" >> $GITHUB_STEP_SUMMARY

